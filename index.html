<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thần Trụ Trời</title>
<style>
  :root {
    --navy: #0b1b33;
    --navy-2: #16305a;
    --gold: #d4af37;
    --gold-light: #f5dc8a;
    --cream: #f4ecd8;
    --brown: #3e2612;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Georgia", "Times New Roman", serif;
    background: radial-gradient(ellipse at center, var(--navy-2) 0%, var(--navy) 70%);
    color: var(--cream);
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas hạt bụi vàng */
  #dust {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* Mây trôi */
  .cloud {
    position: fixed;
    width: 260px; height: 90px;
    background:
      radial-gradient(circle at 30% 60%, rgba(212,175,55,.18) 0 35%, transparent 36%),
      radial-gradient(circle at 55% 45%, rgba(212,175,55,.22) 0 30%, transparent 31%),
      radial-gradient(circle at 75% 60%, rgba(212,175,55,.15) 0 28%, transparent 29%);
    filter: blur(2px);
    opacity: .6;
    animation: drift linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  .cloud:nth-child(2) { top: 12%; animation-duration: 60s; animation-delay: -10s; transform: scale(1.4); }
  .cloud:nth-child(3) { top: 65%; animation-duration: 80s; animation-delay: -35s; transform: scale(1.8); }
  .cloud:nth-child(4) { top: 35%; animation-duration: 70s; animation-delay: -5s;  transform: scale(1.1); }

  @keyframes drift {
    from { left: -300px; }
    to   { left: 110vw; }
  }

  /* Cuộn giấy cổ */
  .scroll {
    position: relative;
    z-index: 1;
    width: min(680px, 92vw);
    padding: 70px 56px;
    background:
      radial-gradient(ellipse at 30% 20%, #f7ebc8 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, #d9bb84 0%, transparent 55%),
      linear-gradient(180deg, #efdcab, #d9bd86);
    color: var(--brown);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 80px rgba(120,70,20,.35);
    clip-path: inset(0 0 100% 0);
    animation: unroll 2.2s cubic-bezier(.6,.05,.2,1) .3s forwards;
    text-align: center;
  }
  .scroll::before, .scroll::after {
    content: "";
    position: absolute; left: -14px; right: -14px;
    height: 26px;
    background: linear-gradient(90deg, #8a5a22, #f3dfa6 20%, #c59a52 50%, #f3dfa6 80%, #8a5a22);
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .scroll::before { top: -13px; }
  .scroll::after  { bottom: -13px; }

  @keyframes unroll {
    to { clip-path: inset(0 0 0 0); }
  }

  .label {
    font-size: 13px;
    letter-spacing: 6px;
    color: #8a5a22;
    text-transform: uppercase;
    opacity: 0;
    animation: fade .8s ease 2.2s forwards;
  }

  h1 {
    margin: 14px 0 18px;
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 700;
    background: linear-gradient(90deg, #8a5a22, var(--gold), var(--gold-light), var(--gold), #8a5a22);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 20px rgba(212,175,55,.25);
  }
  @keyframes shimmer { to { background-position: 300% 0; } }

  .text {
    min-height: 120px;
    font-size: 18px;
    line-height: 1.8;
    font-style: italic;
  }
  .caret::after {
    content: "|";
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .btn {
    margin-top: 26px;
    padding: 12px 34px;
    font: inherit;
    font-size: 16px;
    color: var(--gold-light);
    background: var(--navy);
    border: 1px solid var(--gold);
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    animation: fade .8s ease forwards;
    transition: transform .25s, box-shadow .25s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 22px rgba(212,175,55,.55);
  }

  .hidden { display: none; }

  @keyframes fade { to { opacity: 1; } }

  /* Hiệu ứng vệt sáng theo chuột */
  #glow {
    position: fixed;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,.18), transparent 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    transition: left .15s ease-out, top .15s ease-out;
  }
</style>
</head>
<body>

<canvas id="dust"></canvas>
<div id="glow"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<main class="scroll">
  <p class="label">Thần thoại Việt Nam</p>
  <h1>Thần Trụ Trời</h1>
  <p class="text caret" id="typed"></p>
  <button class="btn" id="btn">Khám phá câu chuyện</button>
</main>

<script>
  // ===== Hạt bụi vàng bay lơ lửng =====
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    particles = Array.from({ length: 90 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -Math.random() * 0.4 - 0.1,
      a: Math.random()
    }));
  }
  resize();
  addEventListener('resize', resize);

  function drawDust() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.a += 0.01;
      if (p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
      const alpha = (Math.sin(p.a) + 1) / 2 * 0.8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245, 220, 138, ${alpha})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#d4af37';
      ctx.fill();
    }
    requestAnimationFrame(drawDust);
  }
  drawDust();

  // ===== Vệt sáng theo chuột =====
  const glow = document.getElementById('glow');
  addEventListener('mousemove', e => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });

  // ===== Gõ chữ từng ký tự =====
  const text = 'Ngày xưa, trời đất còn hỗn độn, chưa phân chia. Một vị thần khổng lồ đã đội trời, dựng cột đá chống đỡ bầu trời, để đất và trời có chỗ đứng riêng của mình...';
  const typed = document.getElementById('typed');
  const btn = document.getElementById('btn');
  let i = 0;

  function type() {
    if (i <= text.length) {
      typed.textContent = text.slice(0, i++);
      setTimeout(type, 45);
    } else {
      typed.classList.remove('caret');
    }
  }
  setTimeout(type, 2600);

  // ===== Nút bấm: hiện thêm nội dung =====
  btn.addEventListener('click', () => {
    btn.textContent = 'Thần đã phá cột, núi non hình thành!';
    btn.style.color = '#fff';
    document.body.animate(
      [{ filter: 'brightness(1)' }, { filter: 'brightness(1.6)' }, { filter: 'brightness(1)' }],
      { duration: 900 }
    );
  });
</script>
</body>
</html>
